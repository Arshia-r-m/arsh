name: validate

# Runs on every PR. Make "validate" a required status check in the main
# ruleset. Uses pull_request, never pull_request_target, so PRs from forks get
# a read-only token and no secrets.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: shellcheck deploy/deploy.sh deploy/install-zola.sh

      - name: Install Zola (pinned, checksum verified)
        run: deploy/install-zola.sh

      - name: Build
        run: zola build

      - name: Validate built site (same checks the server runs)
        run: deploy/deploy.sh validate public

      # Download from the run page to preview the PR's site locally.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: public/
          retention-days: 7
