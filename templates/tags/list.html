{% extends "base.html" %}

{% block title %}Tags — Arsh{% endblock title %}

{% block content %}
  <section class="page-head">
    <p class="kicker"><a href="/posts/">Posts</a></p>
    <h1>Tags</h1>
  </section>

  <section class="sec">
    <h2>All tags</h2>
    <div>
      <ul class="postlist">
        {% for t in terms %}
        <li><span>{{ t.page_count }} post{% if t.page_count != 1 %}s{% endif %}</span><a href="{{ t.permalink | safe }}">#{{ t.name }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </section>
{% endblock content %}
